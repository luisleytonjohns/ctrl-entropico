<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vox Liber &mdash; CTRL ENTROPICO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="icon" href="img/icon.png" type="image/png">
<meta name="theme-color" content="#1B2A4A">
<style>
/* ═══════════════════════════════════════════════════
   VOX LIBER · Periódico del Simulador
   Tipografía periodística: Source Serif 4 (cuerpo editorial)
   + Playfair Display (titulares) + Lexend (UI sistema)
   ═══════════════════════════════════════════════════ */
:root{
  --navy:#1B2A4A;--navy-deep:#0B1A30;--blue:#2E5C8A;
  --orange:#E8600A;--orange-t:#B84A08;--turquesa:#00A896;--turquesa-t:#007A6D;
  --marfil:#F7F5EF;--pizarra:#475569;--borde:#DEDBD2;--sup:#FFFFFF;--suave:#EFECE4;
  --disp:"Lexend",system-ui,sans-serif;
  --serif:"Source Serif 4","Georgia",serif;
  --titular:"Playfair Display","Georgia",serif;
  --vl-azul:#1A6BA0;--vl-celeste:#5DC1D8;--vl-gris:#F4F6F8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{background:var(--vl-gris);color:#1a1a1a;font:16px/1.6 var(--serif)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
a{color:var(--vl-azul);text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
.in{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* ── BARRA SISTEMA ── */
.sys-bar{background:rgba(11,26,48,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;z-index:20}
.sys-bar .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.sys-marca{display:flex;align-items:center;gap:8px;color:var(--marfil);text-decoration:none}
.sys-marca img{height:26px;width:26px;border-radius:6px}
.sys-marca .word{font:700 1rem/1 var(--disp);letter-spacing:.02em}
.sys-marca .word em{font-style:normal;color:var(--orange)}
.sys-nav{display:flex;gap:10px;align-items:center}
.sys-nav a,.sys-nav button{color:#C9D3E3;font:500 .65rem/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:none;text-decoration:none;transition:all .2s}
.sys-nav a:hover,.sys-nav button:hover{color:#fff;border-color:var(--turquesa)}
.sys-nav .activo{color:#fff;border-color:var(--turquesa);background:rgba(0,168,150,.12)}

/* ── CABECERA PERIÓDICO ── */
.vl-cabecera{background:#fff;border-bottom:3px solid var(--vl-azul);padding:24px 0 16px}
.vl-cabecera .in{display:grid;gap:8px;text-align:center}
.vl-meta-top{display:flex;justify-content:space-between;align-items:center;font:400 .78rem/1 var(--serif);color:#888;letter-spacing:.04em}
.vl-logo-row{display:flex;align-items:center;justify-content:center;gap:14px}
.vl-logo-row img{height:48px}
.vl-titulo{font:700 2.6rem/1 var(--titular);color:var(--vl-azul);letter-spacing:.02em}
.vl-titulo span{color:var(--vl-celeste);font-weight:400}
.vl-linea{height:1px;background:linear-gradient(90deg,transparent,var(--vl-azul),transparent)}
.vl-subtitulo{font:400 .82rem/1.3 var(--serif);color:#666;letter-spacing:.08em;text-transform:uppercase}
.vl-ediciones{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.vl-ed-btn{font:500 .7rem/1 var(--disp);padding:5px 12px;border:1px solid var(--borde);border-radius:4px;background:#fff;color:var(--pizarra);cursor:pointer;transition:all .15s}
.vl-ed-btn:hover{border-color:var(--vl-azul);color:var(--vl-azul)}
.vl-ed-btn.activo{background:var(--vl-azul);color:#fff;border-color:var(--vl-azul)}

/* ── INDICADORES ── */
.vl-indicadores{background:#fff;border-bottom:1px solid var(--borde);overflow-x:auto}
.vl-indicadores .in{display:flex;gap:0;padding-block:0}
.vl-ind{flex:1;min-width:90px;text-align:center;padding:10px 8px;border-right:1px solid var(--borde)}
.vl-ind:last-child{border-right:0}
.vl-ind .nombre{font:500 .6rem/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:#888}
.vl-ind .valor{font:700 .88rem/1.2 var(--serif);color:#1a1a1a;margin-top:3px}
.vl-ind .cambio{font:500 .68rem/1 var(--disp);margin-top:2px}
.vl-ind .cambio.pos{color:#16a34a}
.vl-ind .cambio.neg{color:#dc2626}

/* ── PORTADA ── */
.vl-portada{background:#fff;padding:28px 0 20px;border-bottom:2px solid var(--vl-azul)}
.vl-portada .in{text-align:center}
.vl-portada h1{font:700 clamp(1.6rem,3.5vw,2.4rem)/1.15 var(--titular);color:#1a1a1a;max-width:700px;margin:0 auto}

/* ── CONTENIDO PRINCIPAL ── */
.vl-contenido{padding:28px 0 40px}
.vl-contenido .in{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}

/* Columna principal */
.vl-principal{display:grid;gap:0}
.vl-seccion{margin-bottom:28px}
.vl-sec-titulo{font:700 .7rem/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--vl-azul);padding-bottom:8px;border-bottom:2px solid var(--vl-azul);margin-bottom:16px}
.vl-noticia{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #e5e5e5}
.vl-noticia:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.vl-noticia h3{font:700 1.1rem/1.3 var(--titular);color:#1a1a1a;margin-bottom:5px}
.vl-noticia p{margin:0;font:400 .92rem/1.65 var(--serif);color:#3a3a3a}

/* Columna lateral */
.vl-lateral{display:grid;gap:20px}

/* Bloque horóscopo */
.vl-horoscopo{background:#fff;border:1px solid var(--borde);border-radius:8px;overflow:hidden}
.vl-horoscopo .vl-h-titulo{background:var(--vl-azul);color:#fff;font:700 .68rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;text-align:center}
.vl-h-lista{padding:0;margin:0;list-style:none}
.vl-h-item{padding:10px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
.vl-h-item:hover{background:#f8f9fa}
.vl-h-item:last-child{border-bottom:0}
.vl-h-signo{font:600 .78rem/1 var(--disp);color:var(--vl-azul)}
.vl-h-pred{display:none;margin-top:6px;font:400 .82rem/1.5 var(--serif);color:#555}
.vl-h-item.abierto .vl-h-pred{display:block}

/* Bloque opinión */
.vl-opinion{background:#fff;border:1px solid var(--borde);border-radius:8px;overflow:hidden}
.vl-opinion .vl-o-titulo{background:#2a2a2a;color:#fff;font:700 .68rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;text-align:center}
.vl-o-item{padding:14px;border-bottom:1px solid #f0f0f0}
.vl-o-item:last-child{border-bottom:0}
.vl-o-item h4{font:700 .88rem/1.3 var(--titular);color:#1a1a1a;margin:0 0 4px}
.vl-o-item p{font:400 .8rem/1.5 var(--serif);color:#555;margin:0}

/* Bloque eventos activos (solo académico) */
.vl-eventos-admin{background:#FFF3E0;border:1px solid #FFB74D;border-radius:8px;overflow:hidden}
.vl-eventos-admin .vl-ea-titulo{background:#E65100;color:#fff;font:700 .68rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;text-align:center}
.vl-ea-item{padding:10px 14px;border-bottom:1px solid #FFE0B2;font:400 .82rem/1.4 var(--serif);color:#4E342E}
.vl-ea-item:last-child{border-bottom:0}
.vl-ea-item b{font-weight:600;color:#BF360C}

/* ── FOOTER PERIÓDICO ── */
.vl-pie{background:#fff;border-top:2px solid var(--vl-azul);padding:16px 0}
.vl-pie .in{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.vl-pie-izq{font:400 .78rem/1.4 var(--serif);color:#888}
.vl-pie-der{font:500 .65rem/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--vl-azul)}

/* ── ESTADOS ── */
.vl-cargando{text-align:center;padding:80px 20px;font:400 1rem/1.5 var(--serif);color:#888}
.vl-vacio{text-align:center;padding:80px 20px}
.vl-vacio h2{font:400 1.4rem/1.3 var(--titular);color:#888;margin-bottom:8px}
.vl-vacio p{font:400 .92rem/1.5 var(--serif);color:#aaa}

/* ── RESPONSIVE ── */
@media(max-width:800px){
  .vl-contenido .in{grid-template-columns:1fr}
  .vl-titulo{font-size:2rem}
  .vl-meta-top{flex-direction:column;gap:4px;text-align:center}
}
@media(max-width:500px){
  .vl-titulo{font-size:1.6rem}
  .vl-portada h1{font-size:1.3rem}
  .sys-nav a,.sys-nav button{font-size:.58rem;padding:5px 8px}
  .vl-ind .nombre{font-size:.52rem}
  .vl-ind .valor{font-size:.76rem}
}
</style>
</head>
<body>

<!-- BARRA SISTEMA -->
<nav class="sys-bar">
  <div class="in">
    <a href="index.html" class="sys-marca">
      <img src="img/icon.png" alt="CE">
      <span class="word">CTRL <em>ENTROPICO</em></span>
    </a>
    <div class="sys-nav">
      <a href="decisiones.html">Decisiones</a>
      <a href="voxliber.html" class="activo">Vox Liber</a>
      <a href="resultados.html">Resultados</a>
      <button onclick="Auth.logout()" style="color:#ff6b6b;border-color:rgba(255,107,107,.3)">Salir</button>
    </div>
  </div>
</nav>

<!-- CONTENEDOR DINÁMICO -->
<div id="app">
  <div class="vl-cargando" id="vl-loading">Cargando peri&oacute;dico...</div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/voxliber.js"></script>
<script>
API.configurar('https://script.google.com/macros/s/AKfycbw6C9ihsdqUnD2jolAxeb2TFG3IDqzNcuAZP8MSk8J-qpseuY2KDxKB_8ub68oZvISi/exec');

  },

    window.location.href = 'index.html';
  }
});
</script>
</body>
</html>
